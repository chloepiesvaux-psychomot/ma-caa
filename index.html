const el=id=>document.getElementById(id);
function renderNav(target){target.innerHTML="";
const favCatNames=readFavCats();
const hiddenCatNames=readHiddenCats();
const adminHiddenCatNames=(typeof readAdminBase==="function"?(readAdminBase().hiddenCats||[]):[]);
const catOrder=orderedCategoryNames();
const ordered=categories
  .map((c,i)=>({c,i}))
  .filter(({c})=>c.name==="Favoris"||c.name==="Mode parents"||(!hiddenCatNames.includes(c.name)&&!adminHiddenCatNames.includes(c.name)))
  .sort((a,b)=>{
 if(a.c.name==="Favoris")return -1;if(b.c.name==="Favoris")return 1;
 if(a.c.name==="Mode parents")return 1;if(b.c.name==="Mode parents")return -1;
 const ao=catOrder.indexOf(a.c.name),bo=catOrder.indexOf(b.c.name);
 if(ao>=0&&bo>=0)return ao-bo;
 const ai=favCatNames.indexOf(a.c.name),bi=favCatNames.indexOf(b.c.name);
 if(ai>=0&&bi>=0)return ai-bi;if(ai>=0)return -1;if(bi>=0)return 1;return a.i-b.i;
});
ordered.forEach(({c,i})=>{
  const b=document.createElement("button");
  b.className="cat"+(i===current?" active":"");
  const cd=(typeof adminCategoryDisplay==="function")?adminCategoryDisplay(c):{name:c.name,icon:c.icon};
  b.textContent=cd.icon+" "+cd.name;
  b.onclick=()=>{
    el("drawer").classList.remove("open");
    el("search").value="";
    if(c.name==="Mode parents"&&!adultUnlocked){
      openAdultGate();

    admin.textContent="🛡️ Administrateur";
    admin.onclick=()=>{
      el("drawer").classList.remove("open");
      openAdminAccess();
    };

})}

function readVoiceSettings(){
  try{return JSON.parse(localStorage.getItem(profiledKey(VOICE_KEY))||'{"voice":"","rate":0.9}')}
  catch(e){return {voice:"",rate:0.9}}
}
function writeVoiceSettings(v){
  localStorage.setItem(profiledKey(VOICE_KEY),JSON.stringify(v));
  localStorage.setItem("ma-caa-last-save",String(Date.now()));
  scheduleProfileAutoPush();
}
function frenchVoices(){return speechSynthesis.getVoices().filter(v=>(v.lang||"").toLowerCase().startsWith("fr"))}
function bestFrenchVoice(){
  const s=readVoiceSettings(),vs=frenchVoices();
  if(s.voice){const chosen=vs.find(v=>v.name===s.voice);if(chosen)return chosen}
  return vs.find(v=>/premium|enhanced|audrey|thomas|amelie|amélie|marie/i.test(v.name))||vs[0]||null;
}

function applySavedVoice(u){
  try{
    const s=readVoiceSettings(),v=bestFrenchVoice();
    u.lang="fr-FR";
    u.rate=Number(s.rate||0.9);
    if(v)u.voice=v;
  }catch(e){}
  return u;
}

function openVoiceSettings(){
  const overlay=document.createElement("div");overlay.className="editor-overlay";
  const panel=document.createElement("div");panel.className="editor";
  panel.innerHTML="<h2>🔊 Réglage de la voix</h2><p>Choisis une voix française disponible sur cet appareil.</p>";
  const lab=document.createElement("label");lab.textContent="Voix française";panel.appendChild(lab);
  const sel=document.createElement("select");sel.className="voice-select";
  const vs=frenchVoices(),settings=readVoiceSettings();
  if(!vs.length){const o=document.createElement("option");o.value="";o.textContent="Voix française par défaut";sel.appendChild(o)}

const PROFILES_DIRECTORY_KEY="ma-caa-profiles-directory-sync";
let profilesDirectoryPushTimer=null;

  return {id:p.id,name:p.name,pin:p.pin||"",avatar:p.avatar||""};

function scheduleProfilesDirectoryPush(){
  clearTimeout(profilesDirectoryPushTimer);

async function pushProfilesDirectory(){
  if(!cloudClient)return false;
  const u=await cloudUser();if(!u)return false; // écriture réservée au compte cloud autorisé
  try{
    const data={profiles:readProfiles().map(publicProfileDescriptor),updated_at:new Date().toISOString()};
    const r=await cloudClient.from("app_config").upsert(
      {key:"profiles_directory",data,updated_at:new Date().toISOString()},
      {onConflict:"key"}
    );
    if(r.error)throw r.error;
    localStorage.setItem(PROFILES_DIRECTORY_KEY,new Date().toISOString());
    return true;
  }catch(e){
    console.error("Profiles directory push",e);
    return false;
  }
}
async function pullProfilesDirectory(){
  if(!cloudClient)return false;
  try{
    const r=await cloudClient.from("app_config").select("data,updated_at").eq("key","profiles_directory").maybeSingle();
    if(r.error)throw r.error;
    if(!r.data?.data?.profiles)return false;

    const remote=r.data.data.profiles||[];
    const local=readProfiles();
    const merged=[];
    const seen=new Set();

    // Conserver d'abord TOUS les profils locaux.
    local.forEach(lp=>{
      const rp=remote.find(x=>x.id===lp.id)||remote.find(x=>x.name===lp.name);
      merged.push(rp?{...lp,...rp}:lp);
      seen.add((rp?.id||lp.id)+"|"+(rp?.name||lp.name));
    });

    // Puis ajouter les profils présents seulement dans le répertoire cloud.
    remote.forEach(rp=>{
      const exists=merged.some(x=>x.id===rp.id || x.name===rp.name);
      if(!exists)merged.push(rp);
    });

    if(!merged.length)return false;

    profilesDirectoryPulling=true;
    localStorage.setItem(PROFILES_KEY,JSON.stringify(merged));
    profilesDirectoryPulling=false;
    localStorage.setItem(PROFILES_DIRECTORY_KEY,new Date().toISOString());

    const active=localStorage.getItem(ACTIVE_PROFILE_KEY);
    if(!active || !merged.some(p=>p.id===active)){
      localStorage.setItem(ACTIVE_PROFILE_KEY,merged[0].id);
    }

    syncCustomCategories();
    render();
    renderProfileBar();
    if(document.getElementById("user-home-v38"))openUserHome();
    return true;
  }catch(e){
    profilesDirectoryPulling=false;
    console.error("Profiles directory pull",e);
    return false;
  }
}

async function recoverProfilesFromProfilesTable(){
  if(!cloudClient)return {ok:false,count:0,message:"Supabase indisponible"};
  const u=await cloudUser();
  if(!u)return {ok:false,count:0,message:"Connexion cloud Administrateur requise"};

  try{
    const r=await cloudClient.from("profiles").select("id,name,updated_at").eq("user_id",u.id);
    if(r.error)throw r.error;
    const rows=r.data||[];
    if(!rows.length)return {ok:true,count:0,message:"Aucun profil cloud existant"};

    const local=readProfiles();
    let added=0;
    for(const row of rows){
      if(!row.name)continue;
      if(!local.some(p=>p.name===row.name)){
        local.push({id:"cloud-"+String(row.id),name:row.name});
        added++;
      }
    }
    profilesDirectoryPulling=true;
    localStorage.setItem(PROFILES_KEY,JSON.stringify(local));
    profilesDirectoryPulling=false;

    // Mettre à jour le répertoire global pour les autres appareils.
    await pushProfilesDirectory();

    render();
    renderProfileBar();
    if(document.getElementById("user-home-v38"))openUserHome();
    return {ok:true,count:added,message:rows.length+" profil(s) trouvé(s) dans le cloud"};
  }catch(e){
    console.error("Recover profiles",e);
    return {ok:false,count:0,message:e?.message||String(e)};
  }
}

function repairDoubleProfileKeys(){
  try{
    const id=activeProfile();
    [CUSTOM_KEY,ADDED_KEY,CUSTOM_CATS_KEY,ORDER_KEY,VOICE_KEY].forEach(k=>{
      const correct=k+"::"+id;
      const wrong=k+"::"+id+"::"+id;
      const wrongVal=localStorage.getItem(wrong);
      if(wrongVal!==null){
        const current=localStorage.getItem(correct);
        let shouldCopy=current===null;
        if(!shouldCopy){
          try{
            const a=JSON.parse(current),b=JSON.parse(wrongVal);
            if(Array.isArray(a)&&Array.isArray(b)) shouldCopy=b.length>a.length;
            else if(typeof a==="object"&&typeof b==="object") shouldCopy=Object.keys(b||{}).length>Object.keys(a||{}).length;
          }catch(e){}
        }
        if(shouldCopy)localStorage.setItem(correct,wrongVal);
      }
    });
  }catch(e){}
}

function ensureProfiles(){
  let profiles=readProfiles();
  if(!localStorage.getItem(PROFILES_KEY))writeProfiles(profiles);

  // Validate the remembered active profile.
  let active=localStorage.getItem(ACTIVE_PROFILE_KEY);
  if(!active || !profiles.some(p=>p.id===active)){
    active=profiles[0].id;
    localStorage.setItem(ACTIVE_PROFILE_KEY,active);
  }

  // One-time migration of data created before profiles existed.
  const migrationKey="ma-caa-profile-migration-v171";
  if(!localStorage.getItem(migrationKey)){
    PROFILE_DATA_KEYS.forEach(k=>{
      const old=localStorage.getItem(k);
      const dest=k+"::"+active;
      if(old!==null && localStorage.getItem(dest)===null){
        localStorage.setItem(dest,old);
      }
    });
    localStorage.setItem(migrationKey,"done");
  }
}

function dataUrlToBlob(dataUrl){
  if(typeof dataUrl!=="string" || !dataUrl.startsWith("data:")){
    throw new Error("Image locale invalide");
  }
  const parts=dataUrl.split(",");
  const meta=parts[0]||"", b64=parts.slice(1).join(",");
  const mime=(meta.match(/^data:([^;]+);base64$/)||[])[1]||"image/jpeg";
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new Blob([bytes],{type:mime});
}

async function uploadProfilePhotos(userId,profileId,bundle){
  const storage=bundle?.storage||{},uploaded={};
  for(const [base,raw] of Object.entries(storage)){
    if(typeof raw!=="string")continue;
    let parsed;try{parsed=JSON.parse(raw)}catch(e){continue}
    async function walk(obj,path=[]){
      if(!obj||typeof obj!=="object")return;
      if(Array.isArray(obj)){for(let i=0;i<obj.length;i++)await walk(obj[i],path.concat(i));return}
      for(const [k,v] of Object.entries(obj)){
        if(typeof v==="string"&&v.startsWith("data:image/")){
          const blob=dataUrlToBlob(v),ext=(blob.type.split("/")[1]||"jpg").replace("jpeg","jpg");
          const safeBase=encodeURIComponent(base).replace(/%/g,"_");
          const safePath=path.concat(k).join("-").replace(/[^a-zA-Z0-9_-]/g,"_");
          const filePath=userId+"/"+profileId+"/"+safeBase+"-"+safePath+"."+ext;
          const up=await cloudClient.storage.from("pictograms").upload(filePath,blob,{upsert:true,contentType:blob.type});
          if(!up.error)obj[k]={__cloud_image:true,path:filePath};
          else console.error("Envoi photo pictogramme",up.error);
        }else if(v&&typeof v==="object")await walk(v,path.concat(k));
      }
    }
    await walk(parsed);uploaded[base]=JSON.stringify(parsed);
  }
  return {...storage,...uploaded};
}

  // Les références Storage restent compactes dans localStorage.

function decodeCloudStoredImage(v){
  if(typeof v!=="string")return v;
  if(v.startsWith("data:")||v.startsWith("blob:")||v.startsWith("http"))return v;
  try{
    const o=JSON.parse(v);
    if(o&&o.__cloud_image===true&&typeof o.path==="string")return o;
  }catch(e){}
  return v;
}

async function hydrateCloudPictures(){
  if(!cloudClient)return;
  const all=[...document.querySelectorAll("img")];
  for(const img of all){
    if(img.hasAttribute("data-cloud-path"))continue;
    const s=img.getAttribute("src")||"";
    const d=decodeCloudStoredImage(s);
    if(d&&typeof d==="object"&&d.__cloud_image===true)img.setAttribute("data-cloud-path",d.path);
  }
  const imgs=[...document.querySelectorAll("img[data-cloud-path]")];
  for(const img of imgs){
    const path=img.getAttribute("data-cloud-path");
    if(!path)continue;
    try{
      const dl=await cloudClient.storage.from("pictograms").download(path);
      if(dl.error)throw dl.error;
      const old=img.dataset.objectUrl;
      if(old)URL.revokeObjectURL(old);
      const url=URL.createObjectURL(dl.data);
      img.src=url;img.dataset.objectUrl=url;
    }catch(e){console.error(e)}
  }
}

function compressProfilePhoto(file,done){
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=512,ratio=Math.min(1,max/Math.max(img.width,img.height));
      const w=Math.max(1,Math.round(img.width*ratio)),h=Math.max(1,Math.round(img.height*ratio));
      const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,w,h);
      let data="";
      try{data=canvas.toDataURL("image/jpeg",0.82)}catch(e){data=String(reader.result)}
      done(data);
    };
    img.onerror=()=>done(String(reader.result));
    img.src=String(reader.result);
  };
  reader.readAsDataURL(file);
}

function adminCategoryDisplay(cat){
  const e=readAdminBase().catEdits?.[cat.name]||{};
  return {name:e.name||cat.name,icon:e.icon||cat.icon};

function baseItems(cat){
  const a=readAdminBase();
  const built=cat.items.filter(x=>adminItemAvailable(cat,x)).map(x=>adminItemData(cat,x));
  const moved=[];
  for(const source of categories){
    if(source===cat)continue;
    for(const x of (source.items||[])){
      const id=adminItemId(source,x),e=a.items?.[id]||{};
      if(e.category===cat.name&&!a.hiddenItems.includes(id)&&!a.deletedItems.includes(id)){
        const hasAdminEmoji=!!(e.emoji&&e.emoji!=="🖼️");
        moved.push([e.emoji||x[0],e.label||x[1],e.speech||x[2],x[3],hasAdminEmoji?"":(e.image||x[4]||""),false,id]);
      }
    }
  }
  const extra=(a.addedItems||[]).filter(x=>x.category===cat.name&&!x.deleted&&!x.hidden).map(x=>[x.emoji||"🖼️",x.label,x.speech||x.label,x.id,x.image||"",true]);
  return built.concat(moved,extra);
}
function orderedItems(cat){
  const items=baseItems(cat).concat(addedForCategory(cat.name));
  const map=readOrder(), ids=map[cat.name]||[];
  if(!ids.length) return items;
  const byId=new Map(items.map(x=>[itemId2(x),x]));
  const out=[];
  ids.forEach(id=>{if(byId.has(id)){out.push(byId.get(id));byId.delete(id)}});
  byId.forEach(x=>out.push(x));
  return out;
}
function visibleItems(cat){return orderedItems(cat).filter(x=>!isHidden(x))}
function allItems(){
  // Pour les usages généraux, respecter les catégories masquées Administrateur.
  return normalCategories().flatMap(c=>orderedItems(c));
}
function allItemsIncludingAdminHiddenCategories(){
  // Les Favoris restent accessibles même si leur catégorie source est masquée.

  const a=readAdminBase();
  return categories
    .filter(c=>c.name!=="Favoris"&&c.name!=="Mode parents"&&!a.deletedCats.includes(c.name))
    .flatMap(c=>orderedItems(c));

function favoriteItems(){
  const favs=getFavIds();
  const items=allItemsIncludingAdminHiddenCategories().filter(x=>favs.includes(itemId2(x)) && !isHidden(x));
  const order=readFavOrder();
  if(!order.length)return items;
  const byId=new Map(items.map(x=>[itemId2(x),x])),out=[];
  order.forEach(id=>{if(byId.has(id)){out.push(byId.get(id));byId.delete(id)}});
  byId.forEach(x=>out.push(x));

}

let adultUnlocked=false;
function openAdultGate(){
  // Ne jamais recréer la fenêtre pendant un maintien en cours :
  // des synchronisations/rendus peuvent se produire en arrière-plan.
  const already=document.getElementById("adult-gate");
  if(already)return;

  const overlay=document.createElement("div");overlay.className="adult-overlay";overlay.id="adult-gate";
  const box=document.createElement("div");box.className="adult-box";
  box.innerHTML="<h2>🔒 Mode parents</h2><p>Maintiens le bouton pendant 3 secondes pour accéder aux réglages.</p><div class='holdbar'><div class='holdfill'></div></div>";
  const btn=document.createElement("button");btn.className="holdbtn";btn.textContent="Maintenir 3 secondes";
  const close=document.createElement("button");close.className="closeadult";close.textContent="Annuler";
  box.append(btn,close);overlay.appendChild(box);document.body.appendChild(overlay);

  const fill=box.querySelector(".holdfill");
  let timer=null,raf=null,startAt=0,holding=false,done=false;

  function clearHold(){
    holding=false;
    if(timer){clearTimeout(timer);timer=null}
    if(raf){cancelAnimationFrame(raf);raf=null}
    if(!done)fill.style.width="0%";
  }
  function animate(){
    if(!holding||done)return;
    fill.style.width=Math.min(100,((performance.now()-startAt)/3000)*100)+"%";
    raf=requestAnimationFrame(animate);
  }
  function unlock(){
    if(done)return;
    done=true;holding=false;
    if(timer){clearTimeout(timer);timer=null}
    if(raf){cancelAnimationFrame(raf);raf=null}
    fill.style.width="100%";
    adultUnlocked=true;
    overlay.remove();
    // Basculer explicitement sur Mode parents avant le rendu.
    const idx=categories.findIndex(c=>c.name==="Mode parents");
    if(idx>=0)current=idx;
    render();
    renderProfileBar();
    showFeedback("Mode parents");
  }
  function begin(e){
    if(done||holding)return;
    if(e&&e.cancelable)e.preventDefault();
    holding=true;startAt=performance.now();
    animate();
    timer=setTimeout(unlock,3000);
  }
  function stop(e){
    if(e&&e.cancelable)e.preventDefault();
    if(!done)clearHold();
  }

  // Pointer events évitent le double déclenchement touch + mouse sur iPhone/iPad.
  btn.style.touchAction="none";
  btn.addEventListener("pointerdown",begin);
  btn.addEventListener("pointerup",stop);
  btn.addEventListener("pointercancel",stop);
  btn.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse")stop(e)});
  btn.addEventListener("contextmenu",e=>e.preventDefault());
  close.onclick=()=>{clearHold();overlay.remove()};
}
function lockAdult(){
  parentLazyView=null;adultUnlocked=false;current=0;render();showFeedback("Mode enfant");
  const b=document.getElementById("adultBadge");if(b)b.remove();
}
function ensureAdultBadge(){
  let b=document.getElementById("adultBadge");
  if(!adultUnlocked){if(b)b.remove();return}
  if(!b){b=document.createElement("button");b.id="adultBadge";b.className="adult-badge";b.textContent="🔓 Quitter mode parents";b.onclick=lockAdult;document.body.appendChild(b)}
}

<script>
(async function(){
  const CLEAN_KEY="ma-caa-cache-clean-111";
  try{
    let hadController=!!navigator.serviceWorker?.controller;
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if("caches" in window){
      const names=await caches.keys();
      await Promise.all(names.map(n=>caches.delete(n)));
    }
    if(hadController && !sessionStorage.getItem(CLEAN_KEY)){
      sessionStorage.setItem(CLEAN_KEY,"1");
      location.reload();
    }
  }catch(e){}
})();
</script>

<script>
/* Ma CAA bêta 25 — première étape du Mode administrateur.
   Accès séparé uniquement. Aucun pictogramme de base n'est encore modifié. */
const ADMIN_PIN_KEY="ma-caa-admin-pin-v1";
const DEFAULT_ADMIN_PIN="2580";

const ADMIN_BASE_KEY="ma-caa-admin-base-v1";
function readAdminBase(){try{const a=JSON.parse(localStorage.getItem(ADMIN_BASE_KEY)||'{"items":{},"hiddenItems":[],"deletedItems":[],"hiddenCats":[],"deletedCats":[],"catEdits":{},"addedItems":[],"addedCats":[]}');a.subcategories=a.subcategories||[];a.submenus=a.submenus||{};return a}catch(e){return {items:{},hiddenItems:[],deletedItems:[],hiddenCats:[],deletedCats:[],catEdits:{},addedItems:[],addedCats:[],subcategories:[],submenus:{}}}}
function syncAdminCategories(){
  for(let i=categories.length-1;i>=0;i--){if(categories[i].adminAdded)categories.splice(i,1)}
  const a=readAdminBase();
  const extras=(a.addedCats||[]).filter(c=>!c.deleted).map(c=>({icon:c.icon||"📁",name:c.name,items:[],adminAdded:true,adminId:c.id}));
  const modeIndex=categories.findIndex(c=>c.name==="Mode parents");
  if(modeIndex>=0)categories.splice(modeIndex,0,...extras);else categories.push(...extras);
}
function writeAdminBase(v){
  adminBaseLocalDirty=true;
  localStorage.setItem(ADMIN_BASE_KEY,JSON.stringify(v));
  syncAdminCategories();
  render();
  scheduleAdminBasePush();
}

let adminBaseCloudBusy=false,adminBasePushTimer=null,adminBaseCloudUpdated=null,adminBaseLocalDirty=false;
const ADMIN_LAST_SYNC_KEY="ma-caa-admin-last-sync";
const ADMIN_BASE_UPDATED_KEY="ma-caa-admin-base-updated";
function formatFrDateTime(raw){
  if(!raw)return "—";
  const d=new Date(raw);
  if(Number.isNaN(d.getTime()))return String(raw);
  return d.toLocaleDateString("fr-FR")+" à "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
function markAdminBaseSynced(cloudTime){
  if(cloudTime)localStorage.setItem(ADMIN_BASE_UPDATED_KEY,cloudTime);
  localStorage.setItem(ADMIN_LAST_SYNC_KEY,new Date().toISOString());
}
function adminSyncLabel(){
  const sync=localStorage.getItem(ADMIN_LAST_SYNC_KEY);
  return sync?"Dernière synchronisation de cet appareil : "+formatFrDateTime(sync):"Aucune synchronisation réussie sur cet appareil";
}
function adminBaseUpdatedLabel(){
  const updated=localStorage.getItem(ADMIN_BASE_UPDATED_KEY);
  return updated?"Dernière modification de la base : "+formatFrDateTime(updated):"Dernière modification de la base : inconnue";
}
function scheduleAdminBasePush(){adminBaseLocalDirty=true;clearTimeout(adminBasePushTimer);adminBasePushTimer=setTimeout(adminBasePush,250)}
async function adminBasePush(){
  if(adminBaseCloudBusy||!cloudClient)return false;
  const u=await cloudUser();
  if(!u){
    console.warn("Modification administrateur locale : connexion cloud requise pour l’envoyer.");
    return false;
  }
  adminBaseCloudBusy=true;
  try{
    const r=await cloudClient.from("app_config").upsert({key:"admin_base",data:readAdminBase(),updated_at:new Date().toISOString()},{onConflict:"key"}).select("updated_at").single();
    if(r.error)throw r.error;adminBaseCloudUpdated=r.data?.updated_at||null;markAdminBaseSynced(adminBaseCloudUpdated);adminBaseLocalDirty=false;return true;
  }catch(e){console.error("Admin base push",e);return false}finally{adminBaseCloudBusy=false}
}
async function adminBasePull(showStatus=false){
  const status=document.getElementById("admin-sync-live");
  const setStatus=(txt,ok=false)=>{if(status){status.textContent=txt;status.style.fontWeight="700";status.style.color=ok?"#176b2c":"#8a3b12"}};
  if(adminBaseCloudBusy){if(showStatus)setStatus("Une synchronisation est déjà en cours…");return false}
  if(adminBaseLocalDirty){if(showStatus)setStatus("⏳ Enregistrement de vos modifications…");return false}
  if(!cloudClient){if(showStatus)setStatus("❌ Connexion Supabase indisponible sur cet appareil.");return false}
  adminBaseCloudBusy=true;
  try{
    if(showStatus)setStatus("🔄 Récupération de la base commune…");
    // La lecture de app_config est publique : aucun profil enfant ni session utilisateur n'est nécessaire.
    const r=await cloudClient.from("app_config").select("data,updated_at").eq("key","admin_base").maybeSingle();
    if(r.error)throw r.error;
    if(!r.data){if(showStatus)setStatus("❌ Aucune base commune trouvée dans Supabase.");return false}
    localStorage.setItem(ADMIN_BASE_KEY,JSON.stringify(r.data.data||{}));
    adminBaseCloudUpdated=r.data.updated_at||null;
    markAdminBaseSynced(adminBaseCloudUpdated);
    syncAdminCategories();render();
    if(showStatus)setStatus("✅ Base commune récupérée sur cet appareil : "+formatFrDateTime(localStorage.getItem(ADMIN_LAST_SYNC_KEY)),true);
    updateAdminSyncStatusInPlace();
    return true;
  }catch(e){
    console.error("Admin base pull",e);
    if(showStatus)setStatus("❌ Échec de synchronisation : "+(e?.message||String(e)));
    return false;
  }finally{adminBaseCloudBusy=false}
}

function updateAdminSyncStatusInPlace(){
  const stamp=document.getElementById("admin-sync-stamp");
  const updated=document.getElementById("admin-base-updated");
  if(stamp)stamp.textContent=adminSyncLabel();
  if(updated)updated.textContent=adminBaseUpdatedLabel();
}

function startAdminBaseCloud(){syncAdminCategories();render();setTimeout(adminBasePull,300);setTimeout(adminBasePull,1800);setInterval(()=>{if(document.visibilityState==="visible")adminBasePull(false)},5000);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")adminBasePull()});window.addEventListener("focus",()=>adminBasePull())}

  const id=adminItemId(cat,x),e=readAdminBase().items?.[id]||{};

  return [e.emoji||x[0],e.label||x[1],e.speech||x[2],x[3],resolvedImage,false,id];
}
function adminItemAvailable(cat,x){
  const a=readAdminBase(),id=adminItemId(cat,x),e=a.items?.[id]||{};

function adminManagedBaseItemsFor(cat){
  const a=readAdminBase(),out=[];
  for(const source of categories){
    if(source.name==="Favoris"||source.name==="Mode parents")continue;
    for(const x of (source.items||[])){
      const id=adminItemId(source,x);
      if(a.deletedItems.includes(id))continue;
      const e=a.items?.[id]||{};
      const currentCat=e.category||source.name;
      if(currentCat===cat.name)out.push({source,x,id,e});
    }
  }
  return out;
}

async function compressPictogramImage(file,maxSide=520,quality=.76){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error("Lecture impossible"));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("Image invalide"));
      img.onload=()=>{
        let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        const scale=Math.min(1,maxSide/Math.max(w,h));
        w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));
        const c=document.createElement("canvas");
        let data="",tries=0;
        while(tries<6){
          c.width=w;c.height=h;
          const ctx=c.getContext("2d");ctx.drawImage(img,0,0,w,h);
          data=c.toDataURL("image/jpeg",Math.max(.48,quality-tries*.07));
          if(data.length<=180000)break;
          w=Math.max(1,Math.round(w*.78));h=Math.max(1,Math.round(h*.78));tries++;
        }
        resolve(data);
      };
      img.src=String(reader.result);
    };
    reader.readAsDataURL(file);
  });
}

function adminEditAddedItem(item){
  const cur=(readAdminBase().addedItems||[]).find(x=>x.id===item.id);if(!cur)return;
  adminPermanentPictogramForm(cur);
}
function adminToggleAddedItem(item){
  const a=readAdminBase(),cur=(a.addedItems||[]).find(x=>x.id===item.id);if(!cur)return;
  cur.hidden=!cur.hidden;writeAdminBase(a);adminRefresh();
}
function adminDeleteAddedItem(item){
  if(!confirm("Supprimer ce pictogramme permanent ?"))return;
  const a=readAdminBase(),cur=(a.addedItems||[]).find(x=>x.id===item.id);if(!cur)return;
  cur.deleted=true;writeAdminBase(a);adminRefresh();
}

function adminAddCategory(){const n=prompt("Nom de la nouvelle catégorie :");if(!n)return;const i=prompt("Emoji :","📁");if(i===null)return;const a=readAdminBase();a.addedCats.push({id:"ac"+Date.now(),name:n.trim(),icon:i.trim()||"📁"});writeAdminBase(a);adminRefresh()}
function adminAddPictogram(){adminPermanentPictogramForm(null)}
function installAdminButton(){
  if(document.getElementById("admin-access-beta25"))return;
  const b=document.createElement("button");
  b.id="admin-access-beta25";
  b.type="button";
  b.textContent="🛡️ Administrateur";
  b.title="Accès réservé à l’administrateur de Ma CAA";
  b.style.position="fixed";
  b.style.left="12px";
  b.style.bottom="86px";
  b.style.zIndex="8000";
  b.style.border="0";
  b.style.borderRadius="12px";
  b.style.padding="9px 12px";
  b.style.fontWeight="700";
  b.style.opacity=".9";
  b.onclick=openAdminAccess;
  document.body.appendChild(b);
}
