let current=0,phrase=[];
const el=id=>document.getElementById(id);
function renderNav(target){target.innerHTML="";
const favCatNames=readFavCats();
const hiddenCatNames=readHiddenCats();
const catOrder=orderedCategoryNames();
const ordered=categories
  .map((c,i)=>({c,i}))
  .filter(({c})=>c.name==="Favoris"||c.name==="Mode adulte"||!hiddenCatNames.includes(c.name))
  .sort((a,b)=>{
 if(a.c.name==="Favoris")return -1;if(b.c.name==="Favoris")return 1;
 if(a.c.name==="Mode adulte")return 1;if(b.c.name==="Mode adulte")return -1;
 const ao=catOrder.indexOf(a.c.name),bo=catOrder.indexOf(b.c.name);
 if(ao>=0&&bo>=0)return ao-bo;
 const ai=favCatNames.indexOf(a.c.name),bi=favCatNames.indexOf(b.c.name);
 if(ai>=0&&bi>=0)return ai-bi;if(ai>=0)return -1;if(bi>=0)return 1;return a.i-b.i;
});
ordered.forEach(({c,i})=>{
  const b=document.createElement("button");
  b.className="cat"+(i===current?" active":"");
  b.textContent=c.icon+" "+c.name;
  b.onclick=()=>{current=i;el("search").value="";render();el("drawer").classList.remove("open")};
  target.appendChild(b);

  if(c.name==="Mode adulte"){

function readVoiceSettings(){
  try{return JSON.parse(localStorage.getItem(profiledKey(VOICE_KEY))||'{"voice":"","rate":0.9}')}
  catch(e){return {voice:"",rate:0.9}}
}
function writeVoiceSettings(v){
  localStorage.setItem(profiledKey(VOICE_KEY),JSON.stringify(v));
  localStorage.setItem("ma-caa-last-save",String(Date.now()));
  scheduleProfileAutoPush();
}
function frenchVoices(){return speechSynthesis.getVoices().filter(v=>(v.lang||"").toLowerCase().startsWith("fr"))}
function bestFrenchVoice(){
  const s=readVoiceSettings(),vs=frenchVoices();
  if(s.voice){const chosen=vs.find(v=>v.name===s.voice);if(chosen)return chosen}
  return vs.find(v=>/premium|enhanced|audrey|thomas|amelie|amélie|marie/i.test(v.name))||vs[0]||null;
}

function applySavedVoice(u){
  try{
    const s=readVoiceSettings(),v=bestFrenchVoice();
    u.lang="fr-FR";
    u.rate=Number(s.rate||0.9);
    if(v)u.voice=v;
  }catch(e){}
  return u;
}

function openVoiceSettings(){
  const overlay=document.createElement("div");overlay.className="editor-overlay";
  const panel=document.createElement("div");panel.className="editor";
  panel.innerHTML="<h2>🔊 Réglage de la voix</h2><p>Choisis une voix française disponible sur cet appareil.</p>";
  const lab=document.createElement("label");lab.textContent="Voix française";panel.appendChild(lab);
  const sel=document.createElement("select");sel.className="voice-select";
  const vs=frenchVoices(),settings=readVoiceSettings();
  if(!vs.length){const o=document.createElement("option");o.value="";o.textContent="Voix française par défaut";sel.appendChild(o)}
  vs.forEach(v=>{const o=document.createElement("option");o.value=v.name;o.textContent=v.name+" ("+v.lang+")";if(v.name===settings.voice)o.selected=true;sel.appendChild(o)});
  panel.appendChild(sel);
  const lr=document.createElement("label");lr.innerHTML='Vitesse : <span class="voice-value">'+Number(settings.rate||0.9).toFixed(1)+'</span>';panel.appendChild(lr);
  const range=document.createElement("input");range.className="voice-range";range.type="range";range.min="0.7";range.max="1.2";range.step="0.1";range.value=settings.rate||0.9;panel.appendChild(range);
  range.oninput=()=>lr.querySelector(".voice-value").textContent=Number(range.value).toFixed(1);
  const row=document.createElement("div");row.className="editor-row";
  const test=document.createElement("button");test.textContent="▶️ Tester";
  test.onclick=()=>{const u=new SpeechSynthesisUtterance("Bonjour, je suis la voix de Ma CAA.");u.lang="fr-FR";u.rate=Number(range.value);const v=vs.find(x=>x.name===sel.value);if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)};
  const save=document.createElement("button");save.className="saveedit";save.textContent="✓ Enregistrer";
  save.onclick=()=>{writeVoiceSettings({voice:sel.value,rate:Number(range.value)});overlay.remove();showFeedback("Voix enregistrée")};
  const cancel=document.createElement("button");cancel.className="canceledit";cancel.textContent="Annuler";cancel.onclick=()=>overlay.remove();
  row.append(test,save,cancel);panel.appendChild(row);overlay.appendChild(panel);document.body.appendChild(overlay);
}

function makeUtterance(text){
  const u=new SpeechSynthesisUtterance(text);

function repairDoubleProfileKeys(){
  try{
    const id=activeProfile();
    [CUSTOM_KEY,ADDED_KEY,CUSTOM_CATS_KEY,ORDER_KEY,VOICE_KEY].forEach(k=>{
      const correct=k+"::"+id;
      const wrong=k+"::"+id+"::"+id;
      const wrongVal=localStorage.getItem(wrong);
      if(wrongVal!==null){
        const current=localStorage.getItem(correct);
        let shouldCopy=current===null;
        if(!shouldCopy){
          try{
            const a=JSON.parse(current),b=JSON.parse(wrongVal);
            if(Array.isArray(a)&&Array.isArray(b)) shouldCopy=b.length>a.length;
            else if(typeof a==="object"&&typeof b==="object") shouldCopy=Object.keys(b||{}).length>Object.keys(a||{}).length;
          }catch(e){}
        }
        if(shouldCopy)localStorage.setItem(correct,wrongVal);
      }
    });
  }catch(e){}
}

function ensureProfiles(){
  let profiles=readProfiles();
  if(!localStorage.getItem(PROFILES_KEY))writeProfiles(profiles);

  // Validate the remembered active profile.
  let active=localStorage.getItem(ACTIVE_PROFILE_KEY);
  if(!active || !profiles.some(p=>p.id===active)){
    active=profiles[0].id;
    localStorage.setItem(ACTIVE_PROFILE_KEY,active);
  }

  // One-time migration of data created before profiles existed.
  const migrationKey="ma-caa-profile-migration-v171";
  if(!localStorage.getItem(migrationKey)){
    PROFILE_DATA_KEYS.forEach(k=>{
      const old=localStorage.getItem(k);
      const dest=k+"::"+active;
      if(old!==null && localStorage.getItem(dest)===null){
        localStorage.setItem(dest,old);
      }
    });
    localStorage.setItem(migrationKey,"done");
  }
}

function exportProfile(id){
  const p=readProfiles().find(x=>x.id===id);if(!p)return;
  const data={format:"ma-caa-profile",version:2,exportedAt:new Date().toISOString(),profile:{name:p.name},storage:{}};
  const suffix="::"+id;
  for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i);
    if(key && key.endsWith(suffix)){
      const base=key.slice(0,-suffix.length);
      data.storage[base]=localStorage.getItem(key);
    }
  }
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  const safe=(p.name||"profil").replace(/[^a-z0-9_-]+/gi,"_");
  const url=URL.createObjectURL(blob);
  a.href=url;a.download="ma-caa-"+safe+"-complet.json";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
  showFeedback("Profil complet exporté");
}
function importProfileFile(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!data||data.format!=="ma-caa-profile"||!data.profile){alert("Ce fichier n'est pas un profil Ma CAA valide.");return}
      const name=(data.profile.name||"Profil importé").trim();
      const profiles=readProfiles();
      const id="u"+Date.now()+Math.random().toString(36).slice(2,7);
      profiles.push({id,name});writeProfiles(profiles);

      if(data.version>=2 && data.storage){
        Object.entries(data.storage).forEach(([base,raw])=>{
          if(typeof raw==="string")localStorage.setItem(base+"::"+id,raw);
        });
      }else{
        const settings=data.settings||{};
        Object.entries(settings).forEach(([base,value])=>{
          localStorage.setItem(base+"::"+id,JSON.stringify(value));
        });
      }

      localStorage.setItem(ACTIVE_PROFILE_KEY,id);
      repairDoubleProfileKeys();
      syncCustomCategories();render();renderProfileBar();
      showFeedback("Profil complet importé : "+name);
    }catch(e){console.error(e);alert("Impossible d'importer ce fichier de profil.");}
  };
  r.readAsText(file);
}

  const input=document.createElement("input");input.type="file";input.accept=".json,application/json";
  input.onchange=()=>{const f=input.files&&input.files[0];if(f)importProfileFile(f)};
  input.click();
}

function dataUrlToBlob(dataUrl){
  if(typeof dataUrl!=="string" || !dataUrl.startsWith("data:")){
    throw new Error("Image locale invalide");
  }
  const parts=dataUrl.split(",");
  const meta=parts[0]||"", b64=parts.slice(1).join(",");
  const mime=(meta.match(/^data:([^;]+);base64$/)||[])[1]||"image/jpeg";
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new Blob([bytes],{type:mime});
}

async function uploadProfilePhotos(userId,profileId,bundle){
  const storage=bundle?.storage||{},uploaded={};
  for(const [base,raw] of Object.entries(storage)){
    if(typeof raw!=="string")continue;
    let parsed;try{parsed=JSON.parse(raw)}catch(e){continue}
    async function walk(obj,path=[]){
      if(!obj||typeof obj!=="object")return;
      if(Array.isArray(obj)){for(let i=0;i<obj.length;i++)await walk(obj[i],path.concat(i));return}
      for(const [k,v] of Object.entries(obj)){
        if(typeof v==="string"&&v.startsWith("data:image/")){
          const blob=dataUrlToBlob(v),ext=(blob.type.split("/")[1]||"jpg").replace("jpeg","jpg");
          const safeBase=encodeURIComponent(base).replace(/%/g,"_");
          const safePath=path.concat(k).join("-").replace(/[^a-zA-Z0-9_-]/g,"_");
          const filePath=userId+"/"+profileId+"/"+safeBase+"-"+safePath+"."+ext;
          const up=await cloudClient.storage.from("pictograms").upload(filePath,blob,{upsert:true,contentType:blob.type});
          if(!up.error)obj[k]={__cloud_image:true,path:filePath};
        }else if(v&&typeof v==="object")await walk(v,path.concat(k));
      }
    }
    await walk(parsed);uploaded[base]=JSON.stringify(parsed);
  }
  return {...storage,...uploaded};
}

function decodeCloudStoredImage(v){
  if(typeof v!=="string")return v;
  if(v.startsWith("data:")||v.startsWith("blob:")||v.startsWith("http"))return v;
  try{
    const o=JSON.parse(v);
    if(o&&o.__cloud_image===true&&typeof o.path==="string")return o;
  }catch(e){}
  return v;
}

async function hydrateCloudPictures(){
  if(!cloudClient)return;
  const all=[...document.querySelectorAll("img")];
  for(const img of all){
    if(img.hasAttribute("data-cloud-path"))continue;
    const s=img.getAttribute("src")||"";
    const d=decodeCloudStoredImage(s);
    if(d&&typeof d==="object"&&d.__cloud_image===true)img.setAttribute("data-cloud-path",d.path);
  }
  const imgs=[...document.querySelectorAll("img[data-cloud-path]")];
  for(const img of imgs){
    const path=img.getAttribute("data-cloud-path");
    if(!path)continue;
    try{
      const dl=await cloudClient.storage.from("pictograms").download(path);
      if(dl.error)throw dl.error;
      const old=img.dataset.objectUrl;
      if(old)URL.revokeObjectURL(old);
      const url=URL.createObjectURL(dl.data);
      img.src=url;img.dataset.objectUrl=url;
    }catch(e){console.error(e)}
  }
}

 autoPushTimer=setTimeout(async()=>{if(autoPushBusy||!cloudClient)return;const id=localStorage.getItem(ACTIVE_PROFILE_KEY);if(!id)return;const u=await cloudUser();if(!u)return;autoPushBusy=true;try{await syncPushOne(id,true)}catch(e){console.error("Auto sync",e)}finally{autoPushBusy=false}},1200);
}

async function syncPushOne(id,silent=false){
  try{
    if(!silent)showFeedback("Synchronisation en cours…");
    if(!cloudClient)throw new Error("Connexion Supabase non initialisée");
    const u=await cloudUser();if(!u)throw new Error("Compte de synchronisation non connecté");
    const p=readProfiles().find(x=>x.id===id);if(!p)throw new Error("Profil local introuvable");
    let bundle=profileBundle(id);
    bundle={...bundle,storage:await uploadProfilePhotos(u.id,id,bundle)};
    const payload={user_id:u.id,name:p.name,data:bundle,updated_at:new Date().toISOString()};
    const q=await cloudClient.from("profiles").select("id").eq("user_id",u.id).eq("name",p.name).limit(1);
    if(q.error)throw q.error;
    const r=q.data?.[0] ? await cloudClient.from("profiles").update(payload).eq("id",q.data[0].id) : await cloudClient.from("profiles").insert(payload);
    if(r.error)throw r.error;
    if(!silent)alert("✓ Profil synchronisé : "+p.name);
  }catch(e){console.error(e);if(!silent)alert("Synchronisation impossible : "+(e?.message||e))}
}

let autoPullBusy=false;
const AUTO_PULL_META_KEY="ma-caa-auto-pull-meta-v1";
function readAutoPullMeta(){try{return JSON.parse(localStorage.getItem(AUTO_PULL_META_KEY)||"{}")}catch(e){return {}}}
function writeAutoPullMeta(v){localStorage.setItem(AUTO_PULL_META_KEY,JSON.stringify(v))}
function autoPullUiBusy(){
  return !!document.querySelector(".adult-overlay,.users-overlay,[role='dialog']");
}
async function safeAutoPullCurrent(){
  if(autoPullBusy||autoPushBusy||!cloudClient||autoPullUiBusy())return;
  const u=await cloudUser();if(!u)return;
  const activeBefore=localStorage.getItem(ACTIVE_PROFILE_KEY);
  const ps=readProfiles(),p=ps.find(x=>x.id===activeBefore);
  if(!p)return;
  autoPullBusy=true;
  try{
    const r=await cloudClient.from("profiles").select("name,updated_at").eq("user_id",u.id).eq("name",p.name).limit(1);
    if(r.error||!r.data?.length)return;
    const row=r.data[0],meta=readAutoPullMeta();
    if(row.updated_at && meta[p.name]!==row.updated_at){
      await syncPullOneByName(p.name,true,true);
      meta[p.name]=row.updated_at;writeAutoPullMeta(meta);
    }
  }catch(e){console.error("Auto pull",e)}
  finally{
    if(activeBefore)localStorage.setItem(ACTIVE_PROFILE_KEY,activeBefore);
    autoPullBusy=false;
  }
}
function startSafeAutoPull(){
  setInterval(()=>{if(document.visibilityState==="visible")safeAutoPullCurrent()},5000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")setTimeout(safeAutoPullCurrent,500)});
}

async function syncPullOneByName(name,silent=false,preserveActive=false){
  try{
    if(!silent)showFeedback("Récupération en cours…");
    if(!name)throw new Error("Entre le nom exact du profil");
    if(!cloudClient)throw new Error("Connexion Supabase non initialisée");
    const u=await cloudUser();if(!u)throw new Error("Compte de synchronisation non connecté");
    const r=await cloudClient.from("profiles").select("*").eq("user_id",u.id).eq("name",name).order("updated_at",{ascending:false}).limit(1);
    if(r.error)throw r.error;
    if(!r.data?.[0])throw new Error("Profil introuvable dans le cloud");
    const activeBefore=localStorage.getItem(ACTIVE_PROFILE_KEY);const row=r.data[0],ps=readProfiles();let p=ps.find(x=>x.name===row.name);
    if(!p){p={id:"u"+Date.now()+Math.random().toString(36).slice(2,7),name:row.name};ps.push(p)}
    const mat=await materializeProfilePhotos(row.data||{}),bundle=mat.bundle;
    for(const [base,raw] of Object.entries(bundle.storage||{})){
      if(typeof raw==="string") localStorage.setItem(base+"::"+p.id,raw);
      else if(raw&&typeof raw==="object"&&raw.__cloud_image===true) localStorage.setItem(base+"::"+p.id,JSON.stringify(raw));
    }
    writeProfiles(ps);if(preserveActive&&activeBefore)localStorage.setItem(ACTIVE_PROFILE_KEY,activeBefore);else localStorage.setItem(ACTIVE_PROFILE_KEY,p.id);repairDoubleProfileKeys();syncCustomCategories();render();renderProfileBar();
    setTimeout(()=>{render();renderProfileBar();hydrateAllCloudPictures();},50);
    if(mat.failures)alert("Profil récupéré, mais "+mat.failures+" photo(s) n'ont pas pu être téléchargées.");
    else if(!silent)alert("✓ Profil récupéré : "+row.name);
  }catch(e){console.error(e);if(!silent)alert("Récupération impossible : "+(e?.message||e))}
}

function normalCategories(){
  syncCustomCategories();
  if(typeof syncAdminCategories==="function")syncAdminCategories();
  const a=readAdminBase();
  return categories.filter(c=>c.name!=="Favoris"&&c.name!=="Mode adulte"&&!a.hiddenCats.includes(c.name)&&!a.deletedCats.includes(c.name));
}
function baseItems(cat){
  const a=readAdminBase();
  const built=cat.items.filter(x=>adminItemAvailable(cat,x)).map(x=>adminItemData(cat,x));
  const extra=(a.addedItems||[]).filter(x=>x.category===cat.name&&!x.deleted&&!x.hidden).map(x=>[x.emoji||"🖼️",x.label,x.speech||x.label,x.id]);
  return built.concat(extra);
}
function orderedItems(cat){
  const items=baseItems(cat).concat(addedForCategory(cat.name));
  const map=readOrder(), ids=map[cat.name]||[];
  if(!ids.length) return items;
  const byId=new Map(items.map(x=>[itemId2(x),x]));
  const out=[];
  ids.forEach(id=>{if(byId.has(id)){out.push(byId.get(id));byId.delete(id)}});
  byId.forEach(x=>out.push(x));
  return out;
}
function visibleItems(cat){return orderedItems(cat).filter(x=>!isHidden(x))}
function allItems(){return normalCategories().flatMap(c=>orderedItems(c))}
function favoriteItems(){
  const favs=getFavIds();
  const items=allItems().filter(x=>favs.includes(itemId2(x)) && !isHidden(x));
  const order=readFavOrder();
  if(!order.length)return items;
  const byId=new Map(items.map(x=>[itemId2(x),x])),out=[];
  order.forEach(id=>{if(byId.has(id)){out.push(byId.get(id));byId.delete(id)}});
  byId.forEach(x=>out.push(x));
  return out;
}
function moveFavorite(x,dir){
  const items=favoriteItems(),idx=items.findIndex(y=>itemId2(y)===itemId2(x)),next=idx+dir;
  if(idx<0||next<0||next>=items.length)return;
  [items[idx],items[next]]=[items[next],items[idx]];
  writeFavOrder(items.map(itemId2));
  renderGrid();
}
function moveItem(cat,x,dir){
  let items=orderedItems(cat), idx=items.findIndex(y=>itemId(y)===itemId2(x));
  let next=idx+dir;
  if(idx<0 || next<0 || next>=items.length) return;
  [items[idx],items[next]]=[items[next],items[idx]];
  const map=readOrder();map[cat.name]=items.map(itemId);writeOrder(map);
  renderGrid();
}
function imageHtml(p,emoji){
  if(p && typeof p==="object" && p.__cloud_image===true && p.path){
    return '<img src="" data-cloud-path="'+p.path.replace(/"/g,"&quot;")+'" alt="">';
  }
  if(typeof p==="string" && p) return '<img src="'+p+'" alt="">';
  return '<span class="emo">'+emoji+'</span>';
}

  const btn=document.createElement("button");btn.className="holdbtn";btn.textContent="Maintenir 3 secondes";
  btn.style.webkitUserSelect="none";btn.style.userSelect="none";btn.style.webkitTouchCallout="none";btn.style.touchAction="none";
  const close=document.createElement("button");close.className="closeadult";close.textContent="Annuler";
  box.append(btn,close);overlay.appendChild(box);document.body.appendChild(overlay);

  const fill=box.querySelector(".holdfill");
  let timer=null,raf=null,startAt=0,holding=false,opened=false;

  function reset(){
    holding=false;
    if(timer)clearTimeout(timer);
    if(raf)cancelAnimationFrame(raf);
    timer=null;raf=null;startAt=0;
    fill.style.width="0%";
  }
  function animate(){
    if(!holding)return;
    fill.style.width=Math.min(100,((performance.now()-startAt)/3000)*100)+"%";
    raf=requestAnimationFrame(animate);
  }
  function success(){
    if(opened)return;
    opened=true;reset();adultUnlocked=true;overlay.remove();render();renderProfileBar();showFeedback("Mode adulte");
  }
  function begin(e){
    if(opened||holding)return;
    if(e.cancelable)e.preventDefault();
    holding=true;startAt=performance.now();animate();
    timer=setTimeout(success,3000);
  }
  function stop(e){
    if(e&&e.cancelable)e.preventDefault();
    if(!opened)reset();
  }

  // iPhone/iPad first.
  btn.addEventListener("touchstart",begin,{passive:false});
  btn.addEventListener("touchend",stop,{passive:false});
  btn.addEventListener("touchcancel",stop,{passive:false});
  // Desktop / mouse fallback.
  btn.addEventListener("mousedown",begin);
  btn.addEventListener("mouseup",stop);
  btn.addEventListener("mouseleave",stop);
  btn.addEventListener("contextmenu",e=>e.preventDefault());
  close.onclick=()=>{reset();overlay.remove()};
}

  adultUnlocked=false;current=0;render();showFeedback("Mode enfant");
  const b=document.getElementById("adultBadge");if(b)b.remove();
}

render();

(async function(){
  const CLEAN_KEY="ma-caa-cache-clean-111";
  try{
    let hadController=!!navigator.serviceWorker?.controller;
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if("caches" in window){
      const names=await caches.keys();
      await Promise.all(names.map(n=>caches.delete(n)));
    }
    if(hadController && !sessionStorage.getItem(CLEAN_KEY)){
      sessionStorage.setItem(CLEAN_KEY,"1");
      location.reload();
    }
  }catch(e){}
})();

<script>
/* Ma CAA bêta 25 — première étape du Mode administrateur.
   Accès séparé uniquement. Aucun pictogramme de base n'est encore modifié. */
const ADMIN_PIN_KEY="ma-caa-admin-pin-v1";
const DEFAULT_ADMIN_PIN="2580";

const ADMIN_BASE_KEY="ma-caa-admin-base-v1";
function readAdminBase(){try{return JSON.parse(localStorage.getItem(ADMIN_BASE_KEY)||'{"items":{},"hiddenItems":[],"deletedItems":[],"hiddenCats":[],"deletedCats":[],"catEdits":{},"addedItems":[],"addedCats":[]}')}catch(e){return {items:{},hiddenItems:[],deletedItems:[],hiddenCats:[],deletedCats:[],catEdits:{},addedItems:[],addedCats:[]}}}
function syncAdminCategories(){
  for(let i=categories.length-1;i>=0;i--){if(categories[i].adminAdded)categories.splice(i,1)}
  const a=readAdminBase();
  const extras=(a.addedCats||[]).filter(c=>!c.deleted).map(c=>({icon:c.icon||"📁",name:c.name,items:[],adminAdded:true,adminId:c.id}));
  const modeIndex=categories.findIndex(c=>c.name==="Mode adulte");
  if(modeIndex>=0)categories.splice(modeIndex,0,...extras);else categories.push(...extras);
}
function writeAdminBase(v){
  localStorage.setItem(ADMIN_BASE_KEY,JSON.stringify(v));
  syncAdminCategories();
  render();
  scheduleAdminBasePush();
}

let adminBaseCloudBusy=false,adminBasePushTimer=null,adminBaseCloudUpdated=null;
function scheduleAdminBasePush(){clearTimeout(adminBasePushTimer);adminBasePushTimer=setTimeout(adminBasePush,1200)}
async function adminBasePush(){
  if(adminBaseCloudBusy||!cloudClient)return;
  const u=await cloudUser();if(!u)return;
  adminBaseCloudBusy=true;
  try{
    const r=await cloudClient.from("app_config").upsert({key:"admin_base",data:readAdminBase(),updated_at:new Date().toISOString()},{onConflict:"key"}).select("updated_at").single();
    if(r.error)throw r.error;adminBaseCloudUpdated=r.data?.updated_at||null;
  }catch(e){console.error("Admin base push",e)}finally{adminBaseCloudBusy=false}
}
async function adminBasePull(){
  if(adminBaseCloudBusy||!cloudClient)return;
  const u=await cloudUser();if(!u)return;
  adminBaseCloudBusy=true;
  try{
    const r=await cloudClient.from("app_config").select("data,updated_at").eq("key","admin_base").maybeSingle();
    if(r.error)throw r.error;
    if(r.data&&r.data.updated_at!==adminBaseCloudUpdated){
      localStorage.setItem(ADMIN_BASE_KEY,JSON.stringify(r.data.data||{}));adminBaseCloudUpdated=r.data.updated_at||null;syncAdminCategories();render();
      if(adminUnlocked)openAdminPanel();
    }
  }catch(e){console.error("Admin base pull",e)}finally{adminBaseCloudBusy=false}
}
function startAdminBaseCloud(){syncAdminCategories();render();setInterval(()=>{if(document.visibilityState==="visible")adminBasePull()},5000);setTimeout(adminBasePull,600)}

function adminItemId(cat,x){return cat.name+"||"+x[1]+"||"+x[2]}
function adminCatName(c){return readAdminBase().catEdits?.[c.name]?.name||c.name}
function adminCatIcon(c){return readAdminBase().catEdits?.[c.name]?.icon||c.icon}
function adminItemData(cat,x){
  const e=readAdminBase().items?.[adminItemId(cat,x)]||{};
  return [e.emoji||x[0],e.label||x[1],e.speech||x[2],x[3]];
}
function adminItemAvailable(cat,x){
  const a=readAdminBase(),id=adminItemId(cat,x);
  return !a.hiddenItems.includes(id)&&!a.deletedItems.includes(id);
}

let adminUnlocked=false;

function getAdminPin(){
  return localStorage.getItem(ADMIN_PIN_KEY)||DEFAULT_ADMIN_PIN;
}
function openAdminAccess(){
  const entered=prompt("🔐 Mode administrateur\n\nEntrez le code administrateur :");
  if(entered===null)return;
  if(entered!==getAdminPin()){
    alert("Code administrateur incorrect.");
    return;
  }
  adminUnlocked=true;
  openAdminPanel();
}
function openAdminPanel(){
  const old=document.getElementById("admin-panel-beta25");if(old)old.remove();
  const overlay=document.createElement("div");overlay.id="admin-panel-beta25";
  Object.assign(overlay.style,{position:"fixed",inset:"0",zIndex:"100000",background:"#f4f6fb",overflow:"auto"});
  const top=document.createElement("div");
  Object.assign(top.style,{position:"sticky",top:"0",zIndex:"2",background:"#243b6b",color:"white",padding:"14px 18px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:"12px",flexWrap:"wrap"});
  top.innerHTML='<div><div style="font-size:22px;font-weight:800">🛡️ MODE ADMINISTRATEUR</div><div style="font-size:13px;opacity:.9">Gestion de la base commune</div></div>';
  const exit=document.createElement("button");exit.textContent="✕ Quitter";exit.onclick=()=>{adminUnlocked=false;overlay.remove();};top.appendChild(exit);overlay.appendChild(top);
  const content=document.createElement("div");Object.assign(content.style,{width:"min(980px,calc(100% - 24px))",margin:"18px auto",display:"grid",gap:"14px"});

  const notice=document.createElement("section");notice.style.cssText="background:#fff7d6;border-radius:16px;padding:15px";
  notice.innerHTML="<b>✅ Base commune synchronisée</b><br>Les modifications administrateur sont synchronisées via Supabase entre les appareils.";
  content.appendChild(notice);

  const add=document.createElement("section");add.style.cssText="background:white;border-radius:16px;padding:16px";
  add.innerHTML="<h3>➕ Ajouter à la base</h3>";
  const addPic=document.createElement("button");addPic.textContent="➕ Ajouter un pictogramme permanent";addPic.onclick=()=>adminAddPictogram();
  const addCat=document.createElement("button");addCat.textContent="📁 Ajouter une catégorie";addCat.style.marginLeft="8px";addCat.onclick=()=>adminAddCategory();
  add.append(addPic,addCat);content.appendChild(add);

  const manage=document.createElement("section");manage.style.cssText="background:white;border-radius:16px;padding:16px";
  manage.innerHTML="<h3>🗂️ Catégories et pictogrammes de base</h3>";
  categories.filter(c=>c.name!=="Favoris"&&c.name!=="Mode adulte").forEach(cat=>{
    const a=readAdminBase(),row=document.createElement("div");row.style.cssText="border-top:1px solid #ddd;padding:12px 0";
    const head=document.createElement("div");head.style.cssText="display:flex;gap:6px;align-items:center;flex-wrap:wrap";
    const title=document.createElement("b");title.textContent=adminCatIcon(cat)+" "+adminCatName(cat);head.appendChild(title);
    const btn=(t,f)=>{const b=document.createElement("button");b.textContent=t;b.onclick=f;return b};
    head.append(btn("✏️ Modifier",()=>adminEditCategory(cat)),btn(a.hiddenCats.includes(cat.name)?"👁️ Réafficher":"🙈 Masquer",()=>adminToggleCat(cat)),btn("🗑️ Supprimer",()=>adminDeleteCat(cat)));
    row.appendChild(head);
    cat.items.forEach(x=>{
      const id=adminItemId(cat,x),ir=document.createElement("div");ir.style.cssText="margin:8px 0 0 18px;display:flex;gap:5px;align-items:center;flex-wrap:wrap";
      const d=adminItemData(cat,x),lab=document.createElement("span");lab.textContent=d[0]+" "+d[1];lab.style.minWidth="150px";ir.appendChild(lab);
      ir.append(btn("✏️ Modifier",()=>adminEditItem(cat,x)),btn(a.hiddenItems.includes(id)?"👁️ Réafficher":"🙈 Masquer",()=>adminToggleItem(cat,x)),btn("🗑️ Supprimer",()=>adminDeleteItem(cat,x)));row.appendChild(ir);
    });
    (a.addedItems||[]).filter(x=>x.category===cat.name&&!x.deleted).forEach(item=>{
      const ir=document.createElement("div");ir.style.cssText="margin:8px 0 0 18px;display:flex;gap:5px;align-items:center;flex-wrap:wrap;background:#f7f9fc;padding:7px;border-radius:10px";
      if(item.image){
        const th=document.createElement("img");th.src=item.image;th.alt="";th.style.cssText="width:52px;height:52px;object-fit:contain;border-radius:9px;background:white;border:1px solid #ddd";ir.appendChild(th);
      }
      const lab=document.createElement("span");lab.textContent=(item.image?"":(item.emoji||"🖼️")+" ")+item.label+"  • ajouté";lab.style.minWidth="150px";ir.appendChild(lab);
      ir.append(btn("✏️ Modifier",()=>adminEditAddedItem(item)),btn(item.hidden?"👁️ Réafficher":"🙈 Masquer",()=>adminToggleAddedItem(item)),btn("🗑️ Supprimer",()=>adminDeleteAddedItem(item)));row.appendChild(ir);
    });
    manage.appendChild(row);
  });
  content.appendChild(manage);

  const security=document.createElement("section");security.style.cssText="background:white;border-radius:16px;padding:16px";
  const change=document.createElement("button");change.textContent="🔑 Changer le code administrateur";change.onclick=()=>{
    const cur=prompt("Code actuel :");if(cur===null)return;if(cur!==getAdminPin())return alert("Code incorrect.");
    const n=prompt("Nouveau code (4 chiffres) :");if(n===null)return;if(!/^\d{4}$/.test(n))return alert("4 chiffres requis.");
    if(prompt("Confirmez le code :")!==n)return alert("Les codes ne correspondent pas.");localStorage.setItem(ADMIN_PIN_KEY,n);alert("✓ Code modifié.");
  };security.appendChild(change);content.appendChild(security);
  overlay.appendChild(content);document.body.appendChild(overlay);
}
function adminRefresh(){openAdminPanel();render()}
function adminEditCategory(cat){const a=readAdminBase(),e=a.catEdits[cat.name]||{},n=prompt("Nom de la catégorie :",e.name||cat.name);if(n===null)return;const i=prompt("Emoji :",e.icon||cat.icon);if(i===null)return;a.catEdits[cat.name]={name:n.trim()||cat.name,icon:i.trim()||cat.icon};writeAdminBase(a);adminRefresh()}
function adminToggleCat(cat){const a=readAdminBase(),i=a.hiddenCats.indexOf(cat.name);if(i>=0)a.hiddenCats.splice(i,1);else a.hiddenCats.push(cat.name);writeAdminBase(a);adminRefresh()}
function adminDeleteCat(cat){if(!confirm("Supprimer cette catégorie de la base ?"))return;const a=readAdminBase();if(!a.deletedCats.includes(cat.name))a.deletedCats.push(cat.name);writeAdminBase(a);adminRefresh()}
function adminEditItem(cat,x){
  const a=readAdminBase(),id=adminItemId(cat,x),e=a.items[id]||{};
  adminPermanentPictogramForm({
    _baseItem:true,_baseId:id,category:cat.name,
    label:e.label||x[1],speech:e.speech||x[2],emoji:e.emoji||x[0],
    image:e.image||""
  });
}
function adminToggleItem(cat,x){const a=readAdminBase(),id=adminItemId(cat,x),i=a.hiddenItems.indexOf(id);if(i>=0)a.hiddenItems.splice(i,1);else a.hiddenItems.push(id);writeAdminBase(a);adminRefresh()}
function adminDeleteItem(cat,x){if(!confirm("Supprimer ce pictogramme de la base ?"))return;const a=readAdminBase(),id=adminItemId(cat,x);if(!a.deletedItems.includes(id))a.deletedItems.push(id);writeAdminBase(a);adminRefresh()}

function adminPermanentPictogramForm(existing){
  const a=readAdminBase();
  const overlay=document.createElement("div");
  overlay.className="editor-overlay";
  overlay.style.zIndex="100500";

  const panel=document.createElement("div");
  panel.className="editor";
  panel.style.maxWidth="680px";
  panel.innerHTML="<h2>"+(existing?"✏️ Modifier le pictogramme permanent":"➕ Ajouter un pictogramme permanent")+"</h2>";

  const categoriesList=[
    ...categories.filter(c=>c.name!=="Favoris"&&c.name!=="Mode adulte").map(c=>c.name),
    ...(a.addedCats||[]).filter(c=>!c.deleted).map(c=>c.name)
  ];

  const mkLabel=t=>{const l=document.createElement("label");l.textContent=t;panel.appendChild(l);return l};

  mkLabel("Catégorie");
  const cat=document.createElement("select");
  cat.style.width="100%";cat.style.padding="12px";cat.style.fontSize="16px";cat.style.borderRadius="10px";
  [...new Set(categoriesList)].forEach(name=>{
    const o=document.createElement("option");o.value=name;o.textContent=name;cat.appendChild(o);
  });
  if(existing&&existing.category)cat.value=existing.category;
  panel.appendChild(cat);

  mkLabel("Nom affiché");
  const label=document.createElement("input");label.type="text";label.autocomplete="off";
  label.value=existing?.label||"";label.placeholder="Ex. Goûter";panel.appendChild(label);

  mkLabel("Phrase prononcée");
  const speech=document.createElement("input");speech.type="text";speech.autocomplete="off";
  speech.value=existing?.speech||"";speech.placeholder="Ex. Je veux goûter";panel.appendChild(speech);

  mkLabel("Image / photo ou emoji");
  const previewWrap=document.createElement("div");
  previewWrap.style.cssText="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:8px 0 10px";
  const preview=document.createElement("img");
  preview.style.cssText="width:110px;height:110px;object-fit:contain;border:2px solid #e3e6ec;border-radius:16px;background:white;display:none";
  const emojiPreview=document.createElement("div");
  emojiPreview.style.cssText="font-size:64px;width:110px;height:110px;display:grid;place-items:center;border:2px solid #e3e6ec;border-radius:16px;background:white";
  previewWrap.append(preview,emojiPreview);panel.appendChild(previewWrap);

  const photoLabel=document.createElement("label");
  photoLabel.className="photo-label";photoLabel.textContent="🖼️ Choisir une photo / image";
  const photo=document.createElement("input");photo.type="file";photo.accept="image/*";photo.style.display="none";
  photoLabel.appendChild(photo);panel.appendChild(photoLabel);

  const photoValue=document.createElement("input");photoValue.type="hidden";photoValue.value=existing?.image||"";
  panel.appendChild(photoValue);

  const clearPhoto=document.createElement("button");clearPhoto.type="button";clearPhoto.textContent="Retirer la photo";
  clearPhoto.style.marginLeft="8px";panel.appendChild(clearPhoto);

  mkLabel("Emoji de remplacement (facultatif)");
  const emoji=document.createElement("input");emoji.type="text";emoji.autocomplete="off";
  emoji.value=existing?.emoji||"🖼️";emoji.placeholder="Ex. 🍎";panel.appendChild(emoji);

  function refreshPreview(){
    if(photoValue.value){
      preview.src=photoValue.value;preview.style.display="block";emojiPreview.style.display="none";
    }else{
      preview.removeAttribute("src");preview.style.display="none";
      emojiPreview.style.display="grid";emojiPreview.textContent=emoji.value.trim()||"🖼️";
    }
  }
  emoji.oninput=refreshPreview;
  clearPhoto.onclick=()=>{photoValue.value="";photo.value="";refreshPreview()};

  photo.onchange=()=>{
    const f=photo.files&&photo.files[0];if(!f)return;
    if(f.size>4*1024*1024){alert("Choisis une image de moins de 4 Mo.");photo.value="";return}
    const reader=new FileReader();
    reader.onload=()=>{photoValue.value=reader.result;refreshPreview()};
    reader.readAsDataURL(f);
  };
  refreshPreview();

  const info=document.createElement("div");
  info.style.cssText="font-size:13px;color:#5b6472;margin-top:10px";
  info.textContent="La photo/image sera enregistrée dans la base commune et synchronisée avec les autres appareils.";
  panel.appendChild(info);

  const row=document.createElement("div");row.className="editor-row";
  const save=document.createElement("button");save.className="saveedit";save.textContent=existing?"✓ Enregistrer":"✓ Ajouter";
  const cancel=document.createElement("button");cancel.className="canceledit";cancel.textContent="Annuler";

  save.onclick=()=>{
    const l=label.value.trim();
    if(!l){alert("Indique le nom du pictogramme.");label.focus();return}
    const s=speech.value.trim()||l;
    const e=emoji.value.trim()||"🖼️";
    const base=readAdminBase();
    if(existing&&existing._baseItem){
      const cur=base.items[existing._baseId]||{};
      cur.label=l;cur.speech=s;cur.emoji=e;
      if(photoValue.value)cur.image=photoValue.value;else delete cur.image;
      base.items[existing._baseId]=cur;
    }else if(existing){
      const cur=(base.addedItems||[]).find(x=>x.id===existing.id);if(!cur)return;
      cur.category=cat.value;cur.label=l;cur.speech=s;cur.emoji=e;
      if(photoValue.value)cur.image=photoValue.value;else delete cur.image;
    }else{
      base.addedItems.push({
        id:"ai"+Date.now(),category:cat.value,label:l,speech:s,emoji:e,
        image:photoValue.value||undefined
      });
    }
    try{writeAdminBase(base)}
    catch(err){alert("L’image est trop volumineuse. Essaie une image plus légère.");return}
    overlay.remove();adminRefresh();
  };
  cancel.onclick=()=>overlay.remove();
  row.append(save,cancel);panel.appendChild(row);
  overlay.appendChild(panel);document.body.appendChild(overlay);
  setTimeout(()=>label.focus(),100);
}

function adminEditAddedItem(item){
  const cur=(readAdminBase().addedItems||[]).find(x=>x.id===item.id);if(!cur)return;
  adminPermanentPictogramForm(cur);
}
function adminToggleAddedItem(item){
  const a=readAdminBase(),cur=(a.addedItems||[]).find(x=>x.id===item.id);if(!cur)return;
  cur.hidden=!cur.hidden;writeAdminBase(a);adminRefresh();
}
function adminDeleteAddedItem(item){
  if(!confirm("Supprimer ce pictogramme permanent ?"))return;
  const a=readAdminBase(),cur=(a.addedItems||[]).find(x=>x.id===item.id);if(!cur)return;
  cur.deleted=true;writeAdminBase(a);adminRefresh();
}

function adminAddCategory(){const n=prompt("Nom de la nouvelle catégorie :");if(!n)return;const i=prompt("Emoji :","📁");if(i===null)return;const a=readAdminBase();a.addedCats.push({id:"ac"+Date.now(),name:n.trim(),icon:i.trim()||"📁"});writeAdminBase(a);adminRefresh()}
function adminAddPictogram(){adminPermanentPictogramForm(null)}
function installAdminButton(){
  if(document.getElementById("admin-access-beta25"))return;
  const b=document.createElement("button");
  b.id="admin-access-beta25";
  b.type="button";
  b.textContent="🛡️ Administrateur";
  b.title="Accès réservé à l’administrateur de Ma CAA";
  b.style.position="fixed";
  b.style.left="12px";
  b.style.bottom="86px";
  b.style.zIndex="8000";
  b.style.border="0";
  b.style.borderRadius="12px";
  b.style.padding="9px 12px";
  b.style.fontWeight="700";
  b.style.opacity=".9";
  b.onclick=openAdminAccess;
  document.body.appendChild(b);
}

</script>
