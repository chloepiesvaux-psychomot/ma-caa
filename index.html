<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17345f">
<title>Ma CAA v0.2</title>
<link rel="manifest" href="manifest.webmanifest">

<body>
<div class="app">

    <header>
      <div id="sentence" class="sentence"><span class="hint">Choisis des pictogrammes pour construire ta phrase</span></div>

    <section>
      <div class="top"><div><small>CATÉGORIE</small><h1 id="title"></h1></div><input id="search" placeholder="🔎 Rechercher…"></div>
      <div class="starter"><b>Débuts de phrase</b><div id="starters"></div></div>
      <div id="grid" class="grid"></div>
    </section>
  </main>
</div>
<div class="bottom"><button id="cats">☰ Catégories</button><button id="speak2">🔊 Parler</button><button id="clear2">🗑 Effacer</button></div>
<div id="drawer" class="drawer"><div class="sheet"><button id="close">✕</button><h2>Catégories</h2><nav id="nav2"></nav></div></div>
<script src="app.js"></script>
</body></html>
