</section></main></div>

<script>
const categories=[{icon:"⭐",name:"Favoris",items:[]},
{icon:"❤️",name:"Besoins du quotidien",items:[["🚽","Toilettes","aller aux toilettes"],["🍽️","Manger","manger"],["🥤","Boire","boire"],["🛏️","Dormir","dormir"],["🚿","Se laver","me laver"],["🪥","Brosser les dents","me brosser les dents"],["👕","S’habiller","m'habiller"],["🧼","Laver les mains","me laver les mains"],["🤝","Aide","de l'aide"],["🎧","Calme","du calme"],["🤕","J’ai mal","j'ai mal"],["🥶","J’ai froid","j'ai froid"],["🥵","J’ai chaud","j'ai chaud"]]},
{icon:"🙂",name:"Émotions",items:[["😊","Content","je suis content"],["😢","Triste","je suis triste"],["😡","En colère","je suis en colère"],["😨","Peur","j'ai peur"],["😴","Fatigué","je suis fatigué"],["😌","Calme","je suis calme"],["😟","Inquiet","je suis inquiet"],["🤢","Malade","je suis malade"],["😕","Je ne comprends pas","je ne comprends pas"]]},

["🥕","Légumes","des légumes"],

]},
{icon:"💬",name:"Mots essentiels",items:[["👍","Oui","oui"],["👎","Non","non"],["🛑","Stop","stop"],["➕","Encore","encore"],["🏁","Fini","c'est fini"],["🤝","Aide","j'ai besoin d'aide"],["🤷","Je ne sais pas","je ne sais pas"],["😕","Je ne comprends pas","je ne comprends pas"]]},
{icon:"❓",name:"Questions",items:[["❓","Quoi ?","quoi"],["📍","Où ?","où"],["👤","Qui ?","qui"],["⏰","Quand ?","quand"],["💭","Pourquoi ?","pourquoi"]]},
{icon:"🔒",name:"Mode adulte",items:[]}
];
const localPictos={"Toilettes":"images/toilettes.png","Manger":"images/manger.png","Boire":"images/boire.png","Eau":"images/eau.png","Dormir":"images/dormir.png","Aide":"images/aide.png","Se laver":"images/se_laver.svg","Brosser les dents":"images/brosser_dents.svg","S’habiller":"images/shabiller.svg","Laver les mains":"images/laver_mains.svg","Calme":"images/calme.svg","J’ai mal":"images/jai_mal.svg","J’ai froid":"images/jai_froid.svg","J’ai chaud":"images/jai_chaud.svg"};
const starters=[["👤","Je","je"],["👉","Je veux","je veux"],["🙅","Je ne veux pas","je ne veux pas"],["🙏","J’ai besoin de","j'ai besoin de"],["➕","Encore","encore"],["🛑","C’est fini","c'est fini"]];
let current=0,phrase=[];
const el=id=>document.getElementById(id);
function renderNav(target){target.innerHTML="";categories.forEach((c,i)=>{const b=document.createElement("button");b.className="cat"+(i===current?" active":"");b.textContent=c.icon+" "+c.name;b.onclick=()=>{current=i;el("search").value="";render();el("drawer").classList.remove("open")};target.appendChild(b)})}

function readVoiceSettings(){
  try{return JSON.parse(localStorage.getItem(profiledKey(VOICE_KEY))||'{"voice":"","rate":0.9}')}
  catch(e){return {voice:"",rate:0.9}}
}
function writeVoiceSettings(v){
  localStorage.setItem(profiledKey(VOICE_KEY),JSON.stringify(v));
  localStorage.setItem("ma-caa-last-save",String(Date.now()));
}
function frenchVoices(){return speechSynthesis.getVoices().filter(v=>(v.lang||"").toLowerCase().startsWith("fr"))}
function bestFrenchVoice(){
  const s=readVoiceSettings(),vs=frenchVoices();
  if(s.voice){const chosen=vs.find(v=>v.name===s.voice);if(chosen)return chosen}
  return vs.find(v=>/premium|enhanced|audrey|thomas|amelie|amélie|marie/i.test(v.name))||vs[0]||null;
}

function applySavedVoice(u){
  try{
    const s=readVoiceSettings(),v=bestFrenchVoice();
    u.lang="fr-FR";
    u.rate=Number(s.rate||0.9);
    if(v)u.voice=v;
  }catch(e){}
  return u;
}

function openVoiceSettings(){
  const overlay=document.createElement("div");overlay.className="editor-overlay";
  const panel=document.createElement("div");panel.className="editor";
  panel.innerHTML="<h2>🔊 Réglage de la voix</h2><p>Choisis une voix française disponible sur cet appareil.</p>";
  const lab=document.createElement("label");lab.textContent="Voix française";panel.appendChild(lab);
  const sel=document.createElement("select");sel.className="voice-select";
  const vs=frenchVoices(),settings=readVoiceSettings();
  if(!vs.length){const o=document.createElement("option");o.value="";o.textContent="Voix française par défaut";sel.appendChild(o)}
  vs.forEach(v=>{const o=document.createElement("option");o.value=v.name;o.textContent=v.name+" ("+v.lang+")";if(v.name===settings.voice)o.selected=true;sel.appendChild(o)});
  panel.appendChild(sel);
  const lr=document.createElement("label");lr.innerHTML='Vitesse : <span class="voice-value">'+Number(settings.rate||0.9).toFixed(1)+'</span>';panel.appendChild(lr);
  const range=document.createElement("input");range.className="voice-range";range.type="range";range.min="0.7";range.max="1.2";range.step="0.1";range.value=settings.rate||0.9;panel.appendChild(range);
  range.oninput=()=>lr.querySelector(".voice-value").textContent=Number(range.value).toFixed(1);
  const row=document.createElement("div");row.className="editor-row";
  const test=document.createElement("button");test.textContent="▶️ Tester";
  test.onclick=()=>{const u=new SpeechSynthesisUtterance("Bonjour, je suis la voix de Ma CAA.");u.lang="fr-FR";u.rate=Number(range.value);const v=vs.find(x=>x.name===sel.value);if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)};
  const save=document.createElement("button");save.className="saveedit";save.textContent="✓ Enregistrer";
  save.onclick=()=>{writeVoiceSettings({voice:sel.value,rate:Number(range.value)});overlay.remove();showFeedback("Voix enregistrée")};
  const cancel=document.createElement("button");cancel.className="canceledit";cancel.textContent="Annuler";cancel.onclick=()=>overlay.remove();
  row.append(test,save,cancel);panel.appendChild(row);overlay.appendChild(panel);document.body.appendChild(overlay);
}

function makeUtterance(text){
  const u=new SpeechSynthesisUtterance(text);
  u.lang="fr-FR";
  u.rate=.88;
  const voices=speechSynthesis.getVoices();
  const v=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith("fr"));
  if(v)u.voice=v;
  applySavedVoice(u);return u;

  try{const s=readVoiceSettings(),chosen=bestFrenchVoice();u.lang="fr-FR";u.rate=s.rate||0.9;if(chosen)u.voice=chosen}catch(e){}
}
function speakText(text){
  if(!text || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  speechSynthesis.speak(makeUtterance(text));
}
function showFeedback(label){
  const f=el("feedback");
  f.textContent="🔊 "+label;
  f.classList.add("show");
  clearTimeout(window.__feedbackTimer);
  window.__feedbackTimer=setTimeout(()=>f.classList.remove("show"),800);
}
function add(x){
  showFeedback(x[1]);
  phrase.push({icon:x[0],label:x[1],speech:x[2],picto:localPictos[x[1]]||null});
  renderPhrase();
  speakText(x[2]);
}
function renderPhrase(){const box=el("phrase");box.innerHTML="";if(!phrase.length){box.innerHTML='<span class="hint">Touchez un pictogramme pour construire une phrase</span>';return}phrase.forEach((x,i)=>{const b=document.createElement("button");b.className="token";b.innerHTML=(x.picto?'<img src="'+x.picto+'" alt="">':'<span class="emo">'+x.icon+'</span>')+'<b>'+x.label+'</b>';b.onclick=()=>{phrase.splice(i,1);renderPhrase()};box.appendChild(b)});box.scrollLeft=box.scrollWidth}

const FAV_KEY="ma-caa-favorites-v1";
const HIDDEN_KEY="ma-caa-hidden-v1";
const ORDER_KEY="ma-caa-order-v1";
const CUSTOM_KEY="ma-caa-custom-v1";
const ADDED_KEY="ma-caa-added-v1";
const CUSTOM_CATS_KEY="ma-caa-custom-categories-v1";
const PROFILES_KEY="ma-caa-profiles-v1";
const ACTIVE_PROFILE_KEY="ma-caa-active-profile-v1";
const ADULT_PIN_KEY="ma-caa-adult-pin-v1";
const VOICE_KEY="ma-caa-voice-v1";
const PROFILE_DATA_KEYS=[FAV_KEY,HIDDEN_KEY,ORDER_KEY,CUSTOM_KEY,ADDED_KEY,CUSTOM_CATS_KEY,VOICE_KEY];

function itemId(x){return x[1]+"|"+x[2]}
function activeProfile(){return localStorage.getItem(ACTIVE_PROFILE_KEY)||"default"}
function profiledKey(key){return key+"::"+activeProfile()}
function readList(key){try{return JSON.parse(localStorage.getItem(profiledKey(key))||"[]")}catch(e){return []}}
function writeList(key,val){localStorage.setItem(profiledKey(key),JSON.stringify(val));localStorage.setItem("ma-caa-last-save",String(Date.now()))}
function readOrder(){try{return JSON.parse(localStorage.getItem(profiledKey(ORDER_KEY))||"{}")}catch(e){return {}}}
function writeOrder(val){localStorage.setItem(profiledKey(ORDER_KEY),JSON.stringify(val))}

function getFavIds(){return readList(FAV_KEY)}
function isFav(x){return getFavIds().includes(itemId2(x))}
function toggleFav(x){
  let ids=getFavIds(), id=itemId2(x);
  ids=ids.includes(id)?ids.filter(v=>v!==id):[...ids,id];
  writeList(FAV_KEY,ids);
  renderGrid();
}

function hiddenIds(){return readList(HIDDEN_KEY)}
function isHidden(x){return hiddenIds().includes(itemId2(x))}
function setHidden(x,hidden){
  let ids=hiddenIds(), id=itemId2(x);
  if(hidden && !ids.includes(id)) ids.push(id);
  if(!hidden) ids=ids.filter(v=>v!==id);
  writeList(HIDDEN_KEY,ids);
  renderGrid();
}


function readCustom(){try{return JSON.parse(localStorage.getItem(profiledKey(CUSTOM_KEY))||"{}")}catch(e){return {}}}
function writeCustom(v){localStorage.setItem(profiledKey(CUSTOM_KEY),JSON.stringify(v));localStorage.setItem("ma-caa-last-save",String(Date.now()))}
function customFor(x){return readCustom()[itemId2(x)]||{}}
function displayLabel(x){return customFor(x).label||x[1]}
function spokenText(x){return customFor(x).speech||x[2]}
function displayImage(x){if(isAdded(x)){const a=readAdded().find(v=>v.id===x[3]);return (a&&a.image)||""}return customFor(x).image||localPictos[x[1]]||""}
function displayItem(x){return [x[0],displayLabel(x),spokenText(x)]}
function openEditor(x){
  const old=customFor(x), overlay=document.createElement("div");overlay.className="editor-overlay";
  const panel=document.createElement("div");panel.className="editor";
  panel.innerHTML="<h2>✏️ Modifier le pictogramme</h2>";
  const img=document.createElement("img");img.className="editor-preview";img.alt="";
  const fallback=x[0];
  function refreshPreview(){
    const data=photo.dataset.value||old.image||localPictos[x[1]]||"";
    if(data){img.src=data;img.style.display="block"}else{img.removeAttribute("src");img.style.display="none"}
  }
  panel.appendChild(img);
  const l1=document.createElement("label");l1.textContent="Texte affiché";panel.appendChild(l1);
  const label=document.createElement("input");label.type="text";label.value=old.label||x[1];panel.appendChild(label);
  const l2=document.createElement("label");l2.textContent="Ce que la voix prononce";panel.appendChild(l2);
  const speech=document.createElement("input");speech.type="text";speech.value=old.speech||x[2];panel.appendChild(speech);
  const l3=document.createElement("label");l3.textContent="Image personnelle";panel.appendChild(l3);
  const photoLabel=document.createElement("label");photoLabel.className="photo-label";photoLabel.textContent="📷 Choisir une photo";
  const photo=document.createElement("input");photo.type="file";photo.accept="image/*";photo.style.display="none";photoLabel.appendChild(photo);panel.appendChild(photoLabel);
  photo.onchange=()=>{
    const f=photo.files&&photo.files[0];if(!f)return;
    if(f.size>4*1024*1024){alert("Choisis une image de moins de 4 Mo.");photo.value="";return}
    const reader=new FileReader();
    reader.onload=()=>{photo.dataset.value=reader.result;img.src=reader.result;img.style.display="block"};
    reader.readAsDataURL(f);
  };
  refreshPreview();
  const row=document.createElement("div");row.className="editor-row";
  const save=document.createElement("button");save.className="saveedit";save.textContent="✓ Enregistrer";
  save.onclick=()=>{
    const all=readCustom(), id=itemId2(x);
    const next={label:label.value.trim()||x[1],speech:speech.value.trim()||x[2]};
    if(photo.dataset.value)next.image=photo.dataset.value;else if(old.image)next.image=old.image;
    all[id]=next;
    try{writeCustom(all)}catch(e){alert("La photo est trop volumineuse pour être enregistrée. Essaie une photo plus légère.");return}
    overlay.remove();renderGrid();
  };
  const reset=document.createElement("button");reset.className="resetedit";reset.textContent="↺ Réinitialiser";
  reset.onclick=()=>{const all=readCustom();delete all[itemId2(x)];writeCustom(all);overlay.remove();renderGrid()};
  const cancel=document.createElement("button");cancel.className="canceledit";cancel.textContent="Annuler";cancel.onclick=()=>overlay.remove();
  row.append(save,reset,cancel);panel.appendChild(row);overlay.appendChild(panel);document.body.appendChild(overlay);
}




function readProfiles(){
  try{
    const p=JSON.parse(localStorage.getItem(PROFILES_KEY)||"[]");
    return p.length?p:[{id:"default",name:"Utilisateur"}];
  }catch(e){return [{id:"default",name:"Utilisateur"}]}
}
function writeProfiles(p){localStorage.setItem(PROFILES_KEY,JSON.stringify(p));localStorage.setItem("ma-caa-last-save",String(Date.now()))}
function profileName(){const p=readProfiles().find(x=>x.id===activeProfile());return p?p.name:"Utilisateur"}

function repairDoubleProfileKeys(){
  try{
    const id=activeProfile();
    [CUSTOM_KEY,ADDED_KEY,CUSTOM_CATS_KEY,ORDER_KEY,VOICE_KEY].forEach(k=>{
      const correct=k+"::"+id;
      const wrong=k+"::"+id+"::"+id;
      const wrongVal=localStorage.getItem(wrong);
      if(wrongVal!==null){
        const current=localStorage.getItem(correct);
        let shouldCopy=current===null;
        if(!shouldCopy){
          try{
            const a=JSON.parse(current),b=JSON.parse(wrongVal);
            if(Array.isArray(a)&&Array.isArray(b)) shouldCopy=b.length>a.length;
            else if(typeof a==="object"&&typeof b==="object") shouldCopy=Object.keys(b||{}).length>Object.keys(a||{}).length;
          }catch(e){}
        }
        if(shouldCopy)localStorage.setItem(correct,wrongVal);
      }
    });
  }catch(e){}
}

function ensureProfiles(){
  let profiles=readProfiles();
  if(!localStorage.getItem(PROFILES_KEY))writeProfiles(profiles);

  // Validate the remembered active profile.
  let active=localStorage.getItem(ACTIVE_PROFILE_KEY);
  if(!active || !profiles.some(p=>p.id===active)){
    active=profiles[0].id;
    localStorage.setItem(ACTIVE_PROFILE_KEY,active);
  }

  // One-time migration of data created before profiles existed.
  const migrationKey="ma-caa-profile-migration-v171";
  if(!localStorage.getItem(migrationKey)){
    PROFILE_DATA_KEYS.forEach(k=>{
      const old=localStorage.getItem(k);
      const dest=k+"::"+active;
      if(old!==null && localStorage.getItem(dest)===null){
        localStorage.setItem(dest,old);
      }
    });
    localStorage.setItem(migrationKey,"done");
  }
}

function requireAdultPin(done){
  if(!getAdultPin()){setAdultPinFlow(done);return}
  const overlay=document.createElement("div");overlay.className="editor-overlay";
  const panel=document.createElement("div");panel.className="editor";

  row.append(ok,cancel);panel.append(row);overlay.appendChild(panel);document.body.appendChild(overlay);pin.focus();
}
function changeAdultPin(){
  requireAdultPin(()=>{localStorage.removeItem(ADULT_PIN_KEY);setAdultPinFlow()});
}
function protectedSwitchProfile(id){
  if(id===activeProfile())return;
  requireAdultPin(()=>switchProfile(id));
}

function switchProfile(id){
  localStorage.setItem(ACTIVE_PROFILE_KEY,id);current=0;syncCustomCategories();render();renderProfileBar();showFeedback("Profil : "+profileName());
}
function addProfile(){
  const name=prompt("Prénom ou nom du nouvel utilisateur :");if(!name||!name.trim())return;
  const p=readProfiles(),id="u"+Date.now();p.push({id,name:name.trim()});writeProfiles(p);switchProfile(id);
}
function deleteProfile(id){
  const p=readProfiles();if(p.length<=1){alert("Il faut conserver au moins un utilisateur.");return}
  const target=p.find(x=>x.id===id);if(!target)return;
  if(!confirm("Supprimer le profil « "+target.name+" » et ses personnalisations ?"))return;
  PROFILE_DATA_KEYS.forEach(k=>localStorage.removeItem(k+"::"+id));
  const next=p.filter(x=>x.id!==id);writeProfiles(next);
  if(activeProfile()===id)localStorage.setItem(ACTIVE_PROFILE_KEY,next[0].id);
  syncCustomCategories();render();renderProfileBar();renderGrid();
}

function readCustomCats(){try{return JSON.parse(localStorage.getItem(profiledKey(CUSTOM_CATS_KEY))||"[]")}catch(e){return []}}
function writeCustomCats(v){localStorage.setItem(profiledKey(CUSTOM_CATS_KEY),JSON.stringify(v));localStorage.setItem("ma-caa-last-save",String(Date.now()))}
function customCategoryObjects(){return readCustomCats().map(c=>({icon:c.icon||"📁",name:c.name,items:[],customId:c.id}))}
function syncCustomCategories(){
  for(let i=categories.length-1;i>=0;i--){if(categories[i].customId)categories.splice(i,1)}
  const modeIndex=categories.findIndex(c=>c.name==="Mode adulte");
  const customs=customCategoryObjects();
  if(modeIndex>=0)categories.splice(modeIndex,0,...customs);else categories.push(...customs);
}

  writeCustomCats(readCustomCats().filter(c=>c.id!==cat.customId));
  syncCustomCategories();render();showFeedback("Catégorie supprimée");
}

function writeAdded(v){localStorage.setItem(profiledKey(ADDED_KEY),JSON.stringify(v));localStorage.setItem("ma-caa-last-save",String(Date.now()))}

function itemId2(x){return isAdded(x)?"added|"+x[3]:x[1]+"|"+x[2]}

function normalCategories(){syncCustomCategories();return categories.filter(c=>c.name!=="Favoris" && c.name!=="Mode adulte");}
function baseItems(cat){return cat.items.slice()}
function orderedItems(cat){
  const items=baseItems(cat).concat(addedForCategory(cat.name));
  const map=readOrder(), ids=map[cat.name]||[];
  if(!ids.length) return items;
  const byId=new Map(items.map(x=>[itemId2(x),x]));
  const out=[];
  ids.forEach(id=>{if(byId.has(id)){out.push(byId.get(id));byId.delete(id)}});
  byId.forEach(x=>out.push(x));
  return out;
}
function visibleItems(cat){return orderedItems(cat).filter(x=>!isHidden(x))}
function allItems(){return normalCategories().flatMap(c=>orderedItems(c))}
function favoriteItems(){
  const favs=getFavIds();
  return allItems().filter(x=>favs.includes(itemId2(x)) && !isHidden(x));
}
function moveItem(cat,x,dir){
  let items=orderedItems(cat), idx=items.findIndex(y=>itemId(y)===itemId2(x));
  let next=idx+dir;
  if(idx<0 || next<0 || next>=items.length) return;
  [items[idx],items[next]]=[items[next],items[idx]];
  const map=readOrder();map[cat.name]=items.map(itemId);writeOrder(map);
  renderGrid();
}
function picHtml(x){
  const p=displayImage(x), label=displayLabel(x);
  return (p?'<img src="'+p+'" alt="">':'<span class="emo">'+x[0]+'</span>')+'<b>'+label+'</b>';
}

let adultUnlocked=false;
function openAdultGate(){
  const overlay=document.createElement("div");overlay.className="adult-overlay";
  const box=document.createElement("div");box.className="adult-box";
  box.innerHTML="<h2>🔒 Mode adulte</h2><p>Maintiens le bouton pendant 3 secondes pour accéder aux réglages.</p><div class='holdbar'><div class='holdfill'></div></div>";
  const btn=document.createElement("button");btn.className="holdbtn";btn.textContent="Maintenir 3 secondes";
  const close=document.createElement("button");close.className="closeadult";close.textContent="Annuler";
  box.append(btn,close);overlay.appendChild(box);document.body.appendChild(overlay);
  const fill=box.querySelector(".holdfill");let timer=null,start=0,raf=null;
  function stop(){if(timer)clearTimeout(timer);if(raf)cancelAnimationFrame(raf);timer=null;raf=null;start=0;fill.style.width="0%"}
  function animate(){if(!start)return;fill.style.width=Math.min(100,(Date.now()-start)/30)+"%";raf=requestAnimationFrame(animate)}
  function begin(e){e.preventDefault();start=Date.now();animate();timer=setTimeout(()=>{stop();adultUnlocked=true;overlay.remove();renderGrid();showFeedback("Mode adulte")},3000)}
  btn.addEventListener("pointerdown",begin);
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>btn.addEventListener(ev,stop));
  close.onclick=()=>{stop();overlay.remove()};
}
function lockAdult(){
  adultUnlocked=false;current=0;render();showFeedback("Mode enfant");
  const b=document.getElementById("adultBadge");if(b)b.remove();
}
function ensureAdultBadge(){
  let b=document.getElementById("adultBadge");
  if(!adultUnlocked){if(b)b.remove();return}
  if(!b){b=document.createElement("button");b.id="adultBadge";b.className="adult-badge";b.textContent="🔓 Quitter mode adulte";b.onclick=lockAdult;document.body.appendChild(b)}
}

function renderGrid(){ensureAdultBadge();renderProfileBar();
  const q=el("search").value.trim().toLowerCase(), box=el("grid");box.innerHTML="";
  const c=categories[current];
  if(c.name==="Mode adulte"){if(!adultUnlocked){openAdultGate();return}renderPersonalize(box);return}
  let items=c.name==="Favoris"?favoriteItems():visibleItems(c);
  items=items.filter(x=>displayLabel(x).toLowerCase().includes(q));
  if(c.name==="Favoris" && items.length===0){
    const msg=document.createElement("div");

    box.appendChild(msg);return;
  }
  items.forEach(x=>createNormalCard(x,box));

function speak(){const text=phrase.map(x=>x.speech).join(" ").trim();if(!text)return;speakText(text)}
function render(){el("title").textContent=categories[current].name;renderNav(el("nav"));renderNav(el("nav2"));renderGrid();renderPhrase()}
starters.forEach(x=>{const b=document.createElement("button");b.className="starter";b.textContent=x[0]+" "+x[1];b.onclick=()=>add(x);el("starterrow").appendChild(b)});
el("search").oninput=renderGrid;el("speak").onclick=el("speak2").onclick=speak;el("clear").onclick=el("clear2").onclick=()=>{phrase=[];renderPhrase()};el("undo").onclick=()=>{phrase.pop();renderPhrase()};el("cats").onclick=()=>el("drawer").classList.add("open");el("close").onclick=()=>el("drawer").classList.remove("open");
render();

<script>
(async function(){
  const CLEAN_KEY="ma-caa-cache-clean-111";
  try{
    let hadController=!!navigator.serviceWorker?.controller;
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if("caches" in window){
      const names=await caches.keys();
      await Promise.all(names.map(n=>caches.delete(n)));
    }
    if(hadController && !sessionStorage.getItem(CLEAN_KEY)){
      sessionStorage.setItem(CLEAN_KEY,"1");
      location.reload();
    }
  }catch(e){}
})();
</script>
